name: CourseLoop submission checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  clean-source:
    runs-on: ubuntu-latest
    env:
      CL_RAG_MODE: fts5
      CL_LLM_BASE_URL: ''
      CL_LLM_API_KEY: ''
      CL_LLM_TEXT_BASE_URL: ''
      CL_LLM_TEXT_API_KEY: ''
      CL_LLM_VISION_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python scripts/submission_prepare.py bootstrap
      - run: python -m pytest -q --junitxml=backend-junit.xml
      - run: python -m scripts.smoke_demo_path --out smoke.json
      - run: python scripts/submission_algorithms.py --out algorithms.json
      - run: npm ci && npm run type-check && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check-evidence
          path: |
            backend-junit.xml
            smoke.json
            algorithms.json
