# CourseLoop 反向代理。放到 /etc/nginx/conf.d/courseloop.conf
#
# 前端是纯静态（vite build 的产物），后端只吃 /api —— 前端代码里的
# API_BASE 默认就是 '/api'（frontend/src/api/client.ts），所以这里的
# location 前缀不能改，改了前端要跟着重新构建。

server {
    listen 80;
    server_name courseloop.example.edu;   # ← 改成你的域名
    # 上线前把 80 改成 301 跳 443，证书用 certbot 签：
    #   certbot --nginx -d courseloop.example.edu

    # 课件动辄几十 MB，默认 1M 会让上传在 Nginx 这一层就被 413 掉，
    # 而后端的 MAX_UPLOAD_BYTES 是 80MB —— 两处对不上时报错发生在更外层，
    # 教务看到的是 Nginx 的英文错误页，不是页面里那句人话提示。
    client_max_body_size 80m;

    root /opt/courseloop/frontend/dist;
    index index.html;

    # 前端是 SPA：刷新 /teaching 这类路径时磁盘上没有对应文件，
    # 不回落到 index.html 就是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # —— 缓存策略：部署了新版本，用户刷新一次就要看到新版本 ——
    # 不配的话浏览器会按启发式缓存 index.html，它引用的还是上一版的 js 文件名，
    # 于是"线上看到的"和"刚部署的"不是一版（docs/34 §2.1 那类误判的来源之一）。
    # index.html 每次都向服务器确认；assets/ 下的文件名带内容哈希，内容一变文件名就变，
    # 可以放心长期缓存。build.json 是版本戳，只给服务器本机的 preflight 读，不对外提供。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /build.json {
        return 404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # —— SSE 必需的三行 ——
        # 解题、模考阅卷、拍照批改都是流式返回。少了这三行，答案会攒在缓冲区里
        # 等整段生成完才一次吐出来：功能"能用"，但那个逐字出现的效果没了，
        # 而现场只会觉得"卡了十几秒"。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
